<section
    class="z-2 grid grid-cols-1 md:grid-cols-3 md:grid-rows-3 h-[calc(100vh-150px)] mb-(--bottom-section-title-mobile) md:mb-(--bottom-section-title) max-section-width"
>
    <div
        class="row-start-2 md:row-start-2 md:col-span-3 flex flex-col justify-center items-center text-(--white)"
    >
        <h1 class="text-4xl md:text-7xl lg:text-8xl uppercase text-center">Maja</h1>
        <h1 class="text-4xl md:text-7xl lg:text-8xl uppercase text-center">Domalewska</h1>
    </div>

    <div
        class="row-start-3 gap-2 md:row-start-3 md:col-start-1 md:col-span-1 flex flex-wrap md:flex-nowrap justify-left items-end rounded-md"
    >
        <label
            class="group relative inline-flex w-11 shrink-0 shadow-md rounded-full bg-(--primary) p-0.5 inset-ring inset-ring-gray-900/5 outline-offset-2 outline-(--primary) transition-colors duration-200 ease-in-out has-checked:bg-(--primary) has-focus-visible:outline-2 dark:bg-(--primary) dark:inset-ring-white/10 dark:outline-(--primary) dark:has-checked:bg-(--primary)"
        >
            <span
                class="size-5 rounded-full bg-white shadow-xs ring-1 ring-gray-900/5 transition-transform duration-200 ease-in-out group-has-checked:translate-x-5"
            ></span>

            <input
                type="checkbox"
                name="theme"
                aria-label="Toggle dark mode"
                class="absolute inset-0 size-full appearance-none focus:outline-hidden"
                [checked]="theme.isDark"
                (change)="theme.toggleTheme()"
            />
        </label>
    </div>

    <div
        class="row-start-3 gap-2 md:row-start-3 md:col-start-2 md:col-span-1 flex flex-wrap md:flex-nowrap justify-center items-end"
    >
        <button class="btn dark:btn-dark bg-transparent border-2 grow">Work</button>
        <button class="btn dark:btn-dark bg-transparent border-2 grow">Photos</button>
        <button class="btn dark:btn-dark bg-transparent border-2 grow">Contact</button>
        <a href="/assets/Maja CV.pdf" target="_blank">
            <button class="btn dark:btn-dark dynamic-btn w-full">Resume</button>
        </a>
    </div>
